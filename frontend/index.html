<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Default OG Tags for social media crawlers (overridden by react-helmet on each page) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Industrial Times Network" />
    <meta property="og:title" content="Industrial Times Network — India's Digital Industrial Media Platform" />
    <meta property="og:description" content="India's growing digital industrial media platform delivering industrial news, business promotions, startup stories, podcast interviews, and event coverage." />
    <meta property="og:image" content="/industrialtimes_white.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Industrial Times Network" />
    <meta name="twitter:description" content="India's leading digital industrial media platform." />
    
    <title>Industrial Times</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {pageLanguage: 'en', includedLanguages: 'en,hi', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
